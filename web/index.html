<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NeVoice · AI 音源工房</title>
<style>
  :root{
    --bg:#100919; --panel:#1b1026; --line:#2c1b3d;
    --pink:#ff5c8a; --purple:#a855f7; --orange:#ff8a4c; --cyan:#5ce1e6;
    --txt:#f3e9ff; --dim:#b79fd6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#2a1440 0,var(--bg) 55%),var(--bg);
    color:var(--txt);font-family:"Zen Kaku Gothic New","Hiragino Sans","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;
    background-image:radial-gradient(#fff 1px,transparent 1px);background-size:4px 4px}
  .wrap{max-width:1080px;margin:0 auto;padding:26px 18px 60px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .brand h1{margin:2px 0;font-size:30px;letter-spacing:1px;
    background:linear-gradient(90deg,var(--pink),var(--purple),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand p{margin:0;color:var(--dim);font-size:13px}
  .meters{display:flex;gap:8px}
  .meters div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:74px;text-align:center}
  .meters dt{font-size:11px;color:var(--dim)}
  .meters dd{margin:2px 0 0;font-family:monospace;font-size:15px;color:var(--cyan)}
  .card{background:linear-gradient(180deg,#1d1129,#160d22);border:1px solid var(--line);
    border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .drop{display:block;border:1.5px dashed var(--purple);border-radius:16px;padding:26px;text-align:center;
    cursor:pointer;transition:.2s;background:rgba(168,85,247,.06)}
  .drop:hover,.drop.over{border-color:var(--pink);background:rgba(255,92,138,.1)}
  .drop .k{font-size:26px}
  .drop .t{font-weight:600;margin-top:6px}
  .drop .s{color:var(--dim);font-size:12px;margin-top:4px}
  input[type=file]{display:none}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px}
  .dial label{font-size:13px;color:var(--dim)}
  .dial small{display:block;font-family:monospace;color:var(--pink);margin-top:4px;font-size:12px}
  input[type=range]{width:100%;accent-color:var(--pink);height:4px}
  .textin{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  input[type=text]{flex:1;min-width:160px;background:#120b1d;border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:10px 12px;font-size:14px}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  button{border:1px solid var(--line);background:#241534;color:var(--txt);border-radius:12px;
    padding:11px 18px;font-size:14px;cursor:pointer;transition:.15s;font-weight:600}
  button:hover{border-color:var(--purple)}
  button.primary{background:linear-gradient(90deg,var(--pink),var(--purple));border:none;
    box-shadow:0 6px 18px rgba(255,92,138,.35)}
  button.ghost{background:transparent}
  button:disabled{opacity:.4;cursor:not-allowed}
  .toggle{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim)}
  .seg{display:flex;gap:6px}
  .seg button{padding:6px 12px;font-size:12px;border-radius:9px}
  .seg button.on{background:var(--purple);border-color:var(--purple)}
  .status{font-family:monospace;font-size:13px;color:var(--orange);margin-top:12px;min-height:18px}
  h3{font-size:14px;color:var(--dim);letter-spacing:2px;margin:22px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}
  .grid.daku{grid-template-columns:repeat(10,1fr)}
  .grid.youon{grid-template-columns:repeat(11,1fr)}
  .cell{padding:8px 0;border-radius:10px;background:#1a1027;border:1px solid var(--line);
    text-align:center;cursor:pointer;transition:.12px}
  .cell:hover{border-color:var(--pink);transform:translateY(-1px)}
  .cell .kana{display:block;font-size:15px}
  .cell .roma{display:block;font-size:10px;color:var(--dim);font-family:monospace}
  .cell.ghost{visibility:hidden}
  audio{display:none}
  @media(max-width:640px){.grid{grid-template-columns:repeat(6,1fr)}.grid.daku,.grid.youon{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <p style="letter-spacing:3px;color:var(--pink)">NEVOICE AI ENGINE</p>
      <h1>AI 音源工房</h1>
      <p>丢进任意声音（人声 / 物体 / 电子 / 自然声），生成日语五十音 UTAU 声库</p>
    </div>
    <dl class="meters">
      <div><dt>F0</dt><dd id="m-f0">—</dd></div>
      <div><dt>谐波</dt><dd id="m-harm">—</dd></div>
      <div><dt>引擎</dt><dd id="m-rev">—</dd></div>
      <div><dt>假名</dt><dd id="m-count">0</dd></div>
    </dl>
  </header>

  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".wav,.mp3,.ogg,.flac,.m4a,.aac,.aiff,audio/*" />
      <div class="k">꒰ঌ&#xFE0E;঒&#xFE0E;꒱</div>
      <div class="t" id="fname">点这里选声音，或直接拖进来</div>
      <div class="s">WAV / MP3 / OGG / FLAC · 0.4–3 秒最佳</div>
    </label>

    <div class="row">
      <div class="dial">
        <label>滑音 ←→ 稳音</label>
        <input type="range" id="glide" min="0" max="100" value="28" />
        <small id="glide-r">保留 28% 原滑音</small>
      </div>
      <div class="dial">
        <label>每拍长度</label>
        <input type="range" id="dur" min="22" max="70" value="44" />
        <small id="dur-r">0.44 s</small>
      </div>
      <div class="dial">
        <label>整库移调</label>
        <input type="range" id="pitch" min="-12" max="12" value="0" />
        <small id="pitch-r">C 调 · 不移</small>
      </div>
    </div>

    <div class="textin">
      <input type="text" id="singer" value="nevoice" placeholder="歌手名" />
      <div class="toggle">去爆音
        <div class="seg"><button type="button" id="depop-on" class="on">开</button>
          <button type="button" id="depop-off">关</button></div>
      </div>
      <div class="toggle">oto.ini
        <div class="seg"><button type="button" id="oto-on" class="on">生成</button>
          <button type="button" id="oto-off">不生成</button></div>
      </div>
    </div>

    <div class="btns">
      <button class="primary" id="bake">调出五十音</button>
      <button class="ghost" id="demo">用内置演示音</button>
      <button class="ghost" id="aiueo" disabled>试听 あいうえお</button>
      <button class="ghost" id="dl" disabled>下载样本包 ZIP</button>
    </div>
    <div class="status" id="status">就绪。选好声音后点「调出五十音」</div>
  </div>

  <div class="card">
    <h3>清音 · 五十音</h3>
    <div class="grid" id="grid-go"></div>
    <h3>浊音 · 半浊音</h3>
    <div class="grid daku" id="grid-daku"></div>
    <h3>拗音</h3>
    <div class="grid youon" id="grid-you"></div>
  </div>
</div>
<audio id="player"></audio>

<script>
const $=id=>document.getElementById(id);
let depop=true, includeOto=true, sourceFile=null;
const GO=[["a","ka","sa","ta","na","ha","ma","ya","ra","wa","n"],
 ["i","ki","shi","chi","ni","hi","mi","","ri","",""],
 ["u","ku","su","tsu","nu","fu","mu","yu","ru","",""],
 ["e","ke","se","te","ne","he","me","","re","",""],
 ["o","ko","so","to","no","ho","mo","yo","ro","wo",""]];
const DAKU=[["ga","gi","gu","ge","go","za","ji","zu","ze","zo"],
 ["da","de","do","ba","bi","bu","be","bo","pa","pi"],
 ["pu","pe","po","","","","","","","",""]];
const YOU=[["kya","kyu","kyo","sha","shu","sho","cha","chu","cho","nya","nyu"],
 ["nyo","hya","hyu","hyo","mya","myu","myo","rya","ryu","ryo","gya"],
 ["gyu","gyo","ja","ju","jo","bya","byu","byo","pya","pyu","pyo"]];
const KANA={a:"あ",i:"い",u:"う",e:"え",o:"お",ka:"か",ki:"き",ku:"く",ke:"け",ko:"こ",
 sa:"さ",shi:"し",su:"す",se:"せ",so:"そ",ta:"た",chi:"ち",tsu:"つ",te:"て",to:"と",
 na:"な",ni:"に",nu:"ぬ",ne:"ね",no:"の",ha:"は",hi:"ひ",fu:"ふ",he:"へ",ho:"ほ",
 ma:"ま",mi:"み",mu:"む",me:"め",mo:"も",ya:"や",yu:"ゆ",yo:"よ",ra:"ら",ri:"り",
 ru:"る",re:"れ",ro:"ろ",wa:"わ",wo:"を",n:"ん",ga:"が",gi:"ぎ",gu:"ぐ",ge:"げ",go:"ご",
 za:"ざ",ji:"じ",zu:"ず",ze:"ぜ",zo:"ぞ",da:"だ",de:"で",do:"ど",ba:"ば",bi:"び",bu:"ぶ",
 be:"べ",bo:"ぼ",pa:"ぱ",pi:"ぴ",pu:"ぷ",pe:"ぺ",po:"ぽ",kya:"きゃ",kyu:"きゅ",kyo:"きょ",
 sha:"しゃ",shu:"しゅ",sho:"しょ",cha:"ちゃ",chu:"ちゅ",cho:"ちょ",nya:"にゃ",nyu:"にゅ",
 nyo:"にょ",hya:"ひゃ",hyu:"ひゅ",hyo:"ひょ",mya:"みゃ",myu:"みゅ",myo:"みょ",rya:"りゃ",
 ryu:"りゅ",ryo:"りょ",gya:"ぎゃ",gyu:"ぎゅ",gyo:"ぎょ",ja:"じゃ",ju:"じゅ",jo:"じょ",
 bya:"びゃ",byu:"びゅ",byo:"びょ",pya:"ぴゃ",pyu:"ぴゅ",pyo:"ぴょ"};
function build(root,data){
  root.innerHTML="";
  data.flat().forEach(r=>{
    const d=document.createElement(r?"div":"div");
    if(!r){d.className="cell ghost";root.appendChild(d);return}
    d.className="cell";d.innerHTML=`<span class="kana">${KANA[r]||r}</span><span class="roma">${r}</span>`;
    d.onclick=()=>play(`/api/mora/${r}.wav`);
    root.appendChild(d);
  })
}
build($("grid-go"),GO);build($("grid-daku"),DAKU);build($("grid-you"),YOU);

function play(url){const p=$("player");fetch(url).then(r=>{if(!r.ok)throw 0;return r.blob()})
 .then(b=>{p.src=URL.createObjectURL(b);p.play()}).catch(()=>$("status").textContent="还没生成，先点「调出五十音」")}

$("drop").ondragover=e=>{e.preventDefault();$("drop").classList.add("over")};
$("drop").ondragleave=()=>$("drop").classList.remove("over");
$("drop").ondrop=e=>{e.preventDefault();$("drop").classList.remove("over");
 if(e.dataTransfer.files[0]){sourceFile=e.dataTransfer.files[0];$("fname").textContent=sourceFile.name}};
$("file").onchange=()=>{if($("file").files[0]){sourceFile=$("file").files[0];$("fname").textContent=sourceFile.name}};
$("glide").oninput=e=>{const v=e.target.value;$("glide-r").textContent=v==0?"稳音高":`保留 ${v}% 原滑音`};
$("dur").oninput=e=>$("dur-r").textContent=(e.target.value/100).toFixed(2)+" s";
$("pitch").oninput=e=>{const v=+e.target.value;$("pitch-r").textContent=v==0?"C 调 · 不移":(v<0?`降 ${-v} key`:`升 ${v} key`)};
function seg(on,off,cb){$(on).onclick=()=>{$(on).classList.add("on");$(off).classList.remove("on");cb(true)};
 $(off).onclick=()=>{$(off).classList.add("on");$(on).classList.remove("on");cb(false)}}
seg("depop-on","depop-off",v=>depop=v);seg("oto-on","oto-off",v=>includeOto=v);

async function bake(useDemo){
  const fd=new FormData();
  fd.set("glide",$("glide").value/100);
  fd.set("duration",$("dur").value/100);
  fd.set("semitones",$("pitch").value);
  fd.set("singer",$("singer").value||"nevoice");
  fd.set("oto",includeOto?"1":"0");fd.set("depop",depop?"1":"0");
  if(!useDemo){if(!sourceFile){$("status").textContent="先选一段声音，或点内置演示";return}fd.set("file",sourceFile)}
  $("bake").disabled=true;$("status").textContent="AI 正在分析音色、合成五十音…（约 30–60 秒）";
  try{
    const r=await fetch("/api/bake",{method:"POST",body:fd});const d=await r.json();
    if(!r.ok)throw new Error(d.error);
    $("m-f0").textContent=d.f0+" Hz";$("m-harm").textContent=d.harmonicity;
    $("m-rev").textContent=d.rev;$("m-count").textContent=d.count;
    $("status").textContent=`完成 · ${d.count} 个假名 · 点格子试听`;
    $("aiueo").disabled=false;$("dl").disabled=false;
  }catch(e){$("status").textContent="出错："+e.message}
  $("bake").disabled=false;
}
$("bake").onclick=()=>bake(false);$("demo").onclick=()=>bake(true);
$("aiueo").onclick=()=>play("/api/aiueo.wav");
$("dl").onclick=()=>{window.location="/api/bank.zip"};
</script>
</body>
</html>
